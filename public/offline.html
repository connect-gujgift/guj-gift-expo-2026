<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGE 2026 - Offline</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #1e293b; padding: 2rem; border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 2px solid #0b3d41; max-width: 80%; }
        img { height: 60px; margin-bottom: 1.5rem; }
        h1 { font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -1px; }
        p { color: #94a3b8; font-weight: bold; font-size: 0.8rem; margin-top: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .status { color: #f59e0b; margin-top: 2rem; font-size: 0.7rem; font-weight: 900; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/event-logo.png" alt="Logo">
        <h1>Signal Lost</h1>
        <p>Your device is currently offline.</p>
        <div class="status">CHECKING VENUE WI-FI...</div>
        <button onclick="window.location.reload()" style="margin-top: 2rem; background: #0b3d41; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">RETRY CONNECTION</button>
    </div>
</body>
</html>
